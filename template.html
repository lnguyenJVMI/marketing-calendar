<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Calendar</title>
    <style>
        :root { --jv-blue: #1e3a8a; --blue: #0284c7; --bg: #f1f5f9; --ink: #1e293b; --muted: #64748b; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--ink); padding-bottom: 100px; }
        header { background: var(--jv-blue); color: white; padding: 20px 40px; }
        main { max-width: 1500px; margin: 0 auto; padding: 20px; }

        .floating-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 58, 138, 0.95);
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 50px;
            display: flex;
            gap: 5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 9999;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .nav-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            background: transparent;
            color: rgba(255,255,255,0.7);
            transition: all 0.3s ease;
        }
        .nav-btn.active { background: white; color: var(--jv-blue); }

        .panel { display: none; } .panel.active { display: block; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #cbd5e1; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
        th { background: #f8fafc; color: var(--muted); font-size: 10px; text-transform: uppercase; }
        
        .job-cell { font-weight: bold; color: var(--jv-blue); font-family: monospace; font-size: 14px; }
        .premium-cell { color: #b45309; font-weight: 500; }
        
        .link-btn { background: var(--blue); color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 11px; font-weight: bold; display: inline-block; }
        
        .taping-btn { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; margin: 5px; }
        .timeline-item { border-left: 3px solid var(--blue); padding: 0 0 40px 25px; position: relative; margin-left: 15px; }
        .timeline-item::before { content: ""; position: absolute; left: -11px; top: 0; width: 18px; height: 18px; background: white; border: 4px solid var(--blue); border-radius: 50%; }
    </style>
</head>
<body>
    <header>
        <div style="max-width: 1500px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <h1 style="margin:0;">Marketing Calendar</h1>
            <div style="font-size: 12px; opacity: 0.8;">Last Updated: <span id="update-date"></span></div>
        </div>
    </header>
    
    <div class="floating-nav">
        <button class="nav-btn active" onclick="showTab('cal', event)">Calendar View</button>
        <button class="nav-btn" onclick="showTab('bc', event)">Broadcast Schedule</button>
    </div>

    <main>
        <div id="cal" class="panel active">
            <div class="card"><input type="text" id="search" placeholder="Search events, jobs, or premiums..." oninput="render()" style="width:100%; padding:14px; border-radius:8px; border:1px solid #cbd5e1; font-size: 16px; box-sizing: border-box;"></div>
            <div class="card" style="padding:0; overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th style="width:100px;">Date</th>
                            <th>Communication</th>
                            <th style="width:100px;">Job #</th>
                            <th style="width:180px;">Premium</th>
                            <th style="width:100px;">Type</th>
                            <th style="width:180px;">Producer/Audience</th>
                            <th style="width:80px;">Link</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
        <div id="bc" class="panel">
            <div class="card"><h3>Taping Sessions</h3><div id="tapings"></div></div>
            <div id="timeline"></div>
        </div>
    </main>

    <script>
        var DATA = __PAYLOAD_PLACEHOLDER__;
        document.getElementById('update-date').innerText = DATA.updated;
        
        function showTab(id, event) {
            var panels = document.querySelectorAll(".panel");
            var btns = document.querySelectorAll(".nav-btn");
            for (var p = 0; p < panels.length; p++) { panels[p].classList.remove('active'); }
            for (var b = 0; b < btns.length; b++) { btns[b].classList.remove('active'); }
            document.getElementById(id).classList.add('active');
            if (event && event.currentTarget) event.currentTarget.classList.add('active');
        }

        function jump(date) {
            var panels = document.querySelectorAll(".panel");
            var btns = document.querySelectorAll(".nav-btn");
            for (var p = 0; p < panels.length; p++) { panels[p].classList.remove('active'); }
            for (var b = 0; b < btns.length; b++) { btns[b].classList.remove('active'); }
            document.getElementById('bc').classList.add('active');
            btns[1].classList.add('active');
            setTimeout(function() {
                var el = document.querySelector('[data-date="' + date + '"]');
                if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
            }, 100);
        }

        function render() {
            var s = document.getElementById('search').value.toLowerCase();
            var filtered = [];
            for (var f = 0; f < DATA.items.length; f++) {
                var item = DATA.items[f];
                var content = (item.title || '') + (item.notes || '') + (item.job_number || '') + (item.premium || '') + (item.owner || '') + (item.audience || '');
                if (content.toLowerCase().indexOf(s) !== -1) {
                    filtered.push(item);
                }
            }
            
            var html = '';
            for (var k = 0; k < filtered.length; k++) {
                var i = filtered[k];
                var dateStr = i.date || 'Undated';
                html += '<tr>';
                html += '<td style="font-weight:bold; color:var(--jv-blue); white-space:nowrap;">' + dateStr + '</td>';
                html += '<td style="font-weight:bold; font-size:14px;">' + i.title + '</td>';
                html += '<td class="job-cell">' + (i.job_number || '') + '</td>';
                html += '<td class="premium-cell">' + (i.premium || '') + '</td>';
                html += '<td><span style="font-size:10px; font-weight:bold; padding:3px 8px; border-radius:10px; background:#e2e8f0; color:var(--jv-blue);">' + i.category + '</span></td>';
                html += '<td><div style="font-weight:bold; color:var(--ink);">' + i.owner + '</div><div style="font-size:12px; color:var(--muted);">' + i.audience + '</div></td>';
                if (i.link) {
                    html += '<td><a href="' + i.link + '" class="link-btn" target="_blank">Open</a></td>';
                } else {
                    html += '<td></td>';
                }
                html += '</tr>';
            }
            document.getElementById('tbody').innerHTML = html;
        }

        // Render tapings
        var tapingsHtml = '';
        for (var t = 0; t < DATA.tapings.length; t++) {
            tapingsHtml += '<button class="taping-btn" onclick="jump(\'' + DATA.tapings[t].date + '\')">' + DATA.tapings[t].date + '</button>';
        }
        document.getElementById('tapings').innerHTML = tapingsHtml;

        // Render broadcast timeline
        var timelineHtml = '';
        for (var b = 0; b < DATA.broadcast.length; b++) {
            var item = DATA.broadcast[b];
            timelineHtml += '<div class="timeline-item" data-date="' + item.date + '">';
            timelineHtml += '<div style="font-weight:bold; color:var(--blue); font-size:16px; margin-bottom:8px;">' + item.date + '</div>';
            timelineHtml += '<div class="card">';
            timelineHtml += '<div style="font-size:20px; font-weight:bold; color:var(--jv-blue);">' + item.title + '</div>';
            if (item.notes) { timelineHtml += '<div style="color:var(--muted); margin:12px 0; line-height:1.5;">' + item.notes + '</div>'; }
            timelineHtml += '<div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:10px;">';
            timelineHtml += '<div style="font-size:11px; color:var(--muted); background:#f8fafc; padding:8px; border-radius:4px;"><strong style="display:block; font-size:9px; text-transform:uppercase; color:var(--jv-blue);">Job #</strong>' + (item.job_number || 'N/A') + '</div>';
            timelineHtml += '<div style="font-size:11px; color:var(--muted); background:#f8fafc; padding:8px; border-radius:4px;"><strong style="display:block; font-size:9px; text-transform:uppercase; color:var(--jv-blue);">Premium</strong>' + (item.premium || 'N/A') + '</div>';
            timelineHtml += '<div style="font-size:11px; color:var(--muted); background:#f8fafc; padding:8px; border-radius:4px;"><strong style="display:block; font-size:9px; text-transform:uppercase; color:var(--jv-blue);">Producer</strong>' + item.owner + '</div>';
            timelineHtml += '</div>';
            if (item.link) { timelineHtml += '<div style="margin-top:15px;"><a href="' + item.link + '" class="link-btn" target="_blank" style="padding:10px 20px;">Open Link</a></div>'; }
            timelineHtml += '</div></div>';
        }
        document.getElementById('timeline').innerHTML = timelineHtml;

        render();
    </script>
</body>
</html>
