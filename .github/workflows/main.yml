name: Update Marketing Calendar
on:
  push:
    branches: [ main ]
    paths:
      - '**.xlsx'
      - '**.csv'
      - 'generate_calendar.py'
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas openpyxl
      - name: Generate Calendar
        run: |
          python generate_calendar.py \
            --xlsx "Communications Calendar 2026.xlsx" \
            --csv "Marketing_calendar.csv" \
            --output index.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update calendar from multi-source"
          file_pattern: 'index.html'
