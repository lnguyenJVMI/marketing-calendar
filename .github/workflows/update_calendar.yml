name: Update Marketing Calendar

on:
  push:
    paths:
      - '.github/datafiles/**' # Triggers when you upload to this folder
  workflow_dispatch: # Allows you to run it manually if needed

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl

      - name: Run generator script
        run: python generate_calendar.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add index.html
          git commit -m "Automated calendar update" || echo "No changes to commit"
          git push
