
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Calendar</title>
    <style>
        :root { --jv-blue: #1e3a8a; --blue: #0284c7; --bg: #f1f5f9; --ink: #1e293b; --muted: #64748b; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--ink); padding-bottom: 100px; }
        header { background: var(--jv-blue); color: white; padding: 20px 40px; }
        main { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* THE FLOATING NAVIGATION PILL */
        .floating-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 58, 138, 0.9); /* JV Blue with transparency */
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 50px;
            display: flex;
            gap: 5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 9999;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .nav-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            background: transparent;
            color: rgba(255,255,255,0.7);
            transition: all 0.3s ease;
        }
        .nav-btn.active {
            background: white;
            color: var(--jv-blue);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .panel { display: none; } .panel.active { display: block; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #cbd5e1; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
        th { background: #f8fafc; color: var(--muted); font-size: 11px; text-transform: uppercase; }
        
        .link-btn { background: var(--blue); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; display: inline-block; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
        .detail-item { font-size: 11px; color: var(--muted); background: #f8fafc; padding: 8px; border-radius: 6px; }
        .detail-label { font-weight: bold; color: var(--jv-blue); display: block; text-transform: uppercase; font-size: 9px; }
        
        .taping-btn { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; margin: 5px; }
        .timeline-item { border-left: 3px solid var(--blue); padding: 0 0 40px 25px; position: relative; margin-left: 15px; }
        .timeline-item::before { content: ""; position: absolute; left: -11px; top: 0; width: 18px; height: 18px; background: white; border: 4px solid var(--blue); border-radius: 50%; }
    </style>
</head>
<body>
    <header>
        <div style="max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <h1 style="margin:0;">Marketing Calendar</h1>
            <div style="font-size: 12px; opacity: 0.8;">Last Updated: <span id="update-date"></span></div>
        </div>
    </header>
    
    <!-- THE FLOATING PILL -->
    <div class="floating-nav">
        <button class="nav-btn active" onclick="showTab('cal', event)">Calendar View</button>
        <button class="nav-btn" onclick="showTab('bc', event)">Broadcast Schedule</button>
    </div>

    <main>
        <div id="cal" class="panel active">
            <div class="card"><input type="text" id="search" placeholder="Search events, jobs, or premiums..." oninput="render()" style="width:100%; padding:14px; border-radius:8px; border:1px solid #cbd5e1; font-size: 16px; box-sizing: border-box;"></div>
            <div class="card" style="padding:0; overflow-x:auto;">
                <table><thead><tr><th>Date</th><th>Details</th><th>Type</th><th>Producer/Audience</th><th>Link</th></tr></thead><tbody id="tbody"></tbody></table>
            </div>
        </div>
        <div id="bc" class="panel">
            <div class="card"><h3>Taping Sessions</h3><div id="tapings"></div></div>
            <div id="timeline"></div>
        </div>
    </main>

    <script>
        const DATA = {"items": [], "broadcast": [], "tapings": [], "updated": "May 04, 2026"};
        document.getElementById('update-date').innerText = DATA.updated;
        
        function showTab(id, event) {
            document.querySelectorAll(".panel").forEach(p => p.classList.remove('active'));
            document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(event) event.currentTarget.classList.add('active');
        }

        function jump(date) {
            const btn = document.querySelectorAll('.nav-btn')[1];
            showTab('bc', { currentTarget: btn });
            setTimeout(() => {
                const el = document.querySelector(`[data-date="${date}"]`);
                if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
            }, 100);
        }

        function render() {
            const s = document.getElementById('search').value.toLowerCase();
            const filtered = DATA.items.filter(i => {
                const content = (i.title || '') + (i.notes || '') + (i.job_number || '') + (i.premium || '') + (i.owner || '') + (i.audience || '');
                return content.toLowerCase().includes(s);
            });
            
            document.getElementById('tbody').innerHTML = filtered.map(i => {
                const dateStr = i.date || 'Undated';
                return `
                <tr>
                    <td style="font-weight:bold; color:var(--jv-blue); white-space:nowrap;">\${dateStr}</td>
                    <td>
                        <div style="font-weight:bold; font-size:16px; color:var(--ink);">\${i.title}</div>
                        <div style="color:var(--muted); font-size:13px; margin-top:4px;">\${i.notes || ''}</div>
                        <div class="detail-grid">
                            \${i.job_number ? `<div class="detail-item"><span class="detail-label">Job #</span>\${i.job_number}</div>` : ''}
                            \${i.premium ? `<div class="detail-item"><span class="detail-label">Premium</span>\${i.premium}</div>` : ''}
                            \${i.segment_code ? `<div class="detail-item"><span class="detail-label">Segment</span>\${i.segment_code}</div>` : ''}
                            \${i.final_art ? `<div class="detail-item"><span class="detail-label">Art</span>\${i.final_art}</div>` : ''}
                        </div>
                    </td>
                    <td><span style="font-size:11px; font-weight:bold; padding:4px 10px; border-radius:12px; background:#e2e8f0; color:var(--jv-blue);">\${i.category}</span></td>
                    <td><div style="font-weight:bold; color:var(--ink);">\${i.owner}</div><div style="font-size:13px; color:var(--muted);">\${i.audience}</div></td>
                    <td>\${i.link ? `<a href="\${i.link}" class="link-btn" target="_blank">🔗 Link</a>` : ''}
                </tr>
            `}).join('');
        }

        document.getElementById('tapings').innerHTML = DATA.tapings.map(t => `<button class="taping-btn" onclick="jump('\${t.date}')">\${t.date}</button>`).join('');
        document.getElementById('timeline').innerHTML = DATA.broadcast.map(i => `
            <div class="timeline-item" data-date="\${i.date}">
                <div style="font-weight:bold; color:var(--blue); font-size:16px; margin-bottom:8px;">\${i.date}</div>
                <div class="card">
                    <div style="font-size:20px; font-weight:bold; color:var(--jv-blue);">\${i.title}</div>
                    <div style="color:var(--muted); margin:12px 0; line-height:1.5;">\${i.notes || ''}</div>
                    <div class="detail-grid">
                        <div class="detail-item"><span class="detail-label">Producer</span>\${i.owner}</div>
                        \${i.premium ? `<div class="detail-item"><span class="detail-label">Premium</span>\${i.premium}</div>` : ''}
                    </div>
                    \${i.link ? `<div style="margin-top:20px;"><a href="\${i.link}" class="link-btn" target="_blank" style="padding:10px 20px;">🔗 Open Link</a></div>` : ''}
                </div>
            </div>
        `).join('');
        render();
    </script>
</body>
</html>
